name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: api/src
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements-base.lock
      - name: Install locked product dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-deps
          --require-hashes --requirement api/requirements-base.lock
      - name: Compile product package
        run: python -m compileall -q api/src
      - name: Run read-only database tests
        run: python -m unittest discover -s api/tests -p "test_*.py" -v
